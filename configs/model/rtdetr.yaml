# RT-DETR fine-tuning on the billboard dataset
model:
  pretrained_checkpoint: "PekingU/rtdetr_r50vd"
  label_names: ["billboard"]

data:
  train_annotations: "data/annotations/reviewed/train.json"
  val_annotations: "data/annotations/reviewed/val.json"
  test_annotations: "data/annotations/reviewed/test.json"
  image_dir: "data/processed"

training:
  epochs: 50
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 0.1
  freeze_backbone: true
  num_workers: 4
  seed: 42
  checkpoint_dir: "checkpoints/rtdetr"

augmentation:
  horizontal_flip: 0.5
  scale_range: [0.75, 1.25]
  translate: 0.1
  color_jitter: 0.2

evaluation:
  # Low on purpose: mAP integrates over the whole precision-recall curve.
  score_threshold: 0.01

mlflow:
  experiment_name: "vit-billboard-detector"
  tracking_uri: "sqlite:///mlflow.db"
