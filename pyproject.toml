[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-billboard-detector"
version = "0.1.0"
description = "ViT-based OOH billboard detection (Computer Vision II final project)"
requires-python = ">=3.10"

[project.scripts]
billboard-detect = "interfaces.cli.detect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["vit", "interfaces"]
